name = "pallas-app"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../public"

[[d1_databases]]
binding = "DB"
database_name = "pallas"
database_id = "b4e7644d-52da-48b6-ba59-5ff1efbbe7eb"

[[kv_namespaces]]
binding = "SESSIONS"
id = "f71a0d6b450843529ad720b5a97d783b"

# Secrets (do NOT put real values here — set with `wrangler secret put`):
#   JWT_SECRET    — random string used to sign login tokens
#   GROQ_API_KEY  — Groq API key, used as the cloud AI backend (Ollama isn't reachable from Cloudflare)
